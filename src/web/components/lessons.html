<script async type="module" crossorigin src="/assets/main15.js"></script>
<link rel="stylesheet" crossorigin href="/assets/main.css">
<div class="content-box py-20 px-5" id="lessons-admin-page">
  <div class="mt-8">
    <a data-link="true" href="/"
      class="inline-flex items-center gap-2 text-sm/6 text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-300">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
        <path fill-rule="evenodd"
          d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z"
          clip-rule="evenodd" />
      </svg>
      Volver al inicio
    </a>

    <div class="mt-6 space-y-6">
      <div class="flex flex-wrap items-start justify-between gap-6">
        <div class="space-y-2 max-w-2xl">
          <h1 class="text-2xl font-semibold text-zinc-950 dark:text-white">Cambiar nombres de los temas</h1>
          <p class="text-sm text-zinc-600 dark:text-zinc-400">
            Revisa el estado actual de los temas y actualiza sus nombres cuando sea necesario.
          </p>
        </div>
      </div>

      <div
        class="hidden rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-500/40 dark:bg-red-500/10 dark:text-red-100"
        data-lessons-feedback></div>

      <div class="flow-root">
        <div class="inline-block min-w-full align-middle">
          <table class="min-w-full text-left text-sm/6 text-zinc-950 dark:text-white">
            <thead class="text-xs font-medium uppercase tracking-wide text-zinc-500 dark:text-zinc-400">
              <tr>
                <th class="border-b border-b-zinc-950/10 px-4 py-2 last:pr-4 dark:border-b-white/10">Peso</th>
                <th class="border-b border-b-zinc-950/10 px-4 py-2 first:pl-4 dark:border-b-white/10">Tipo</th>
                <th class="border-b border-b-zinc-950/10 px-4 py-2 dark:border-b-white/10">Tema</th>
                <th class="border-b border-b-zinc-950/10 px-4 py-2 dark:border-b-white/10">Nombre del tema</th>
              </tr>
            </thead>
            <tbody id="lesson-name-list" data-lesson-rows></tbody>
          </table>
        </div>
      </div>
      <div class="flex justify-end">
        <button type="button" data-lessons-save
          class="px-4 py-2 bg-zinc-600 hover:bg-zinc-500 text-white rounded-lg disabled:cursor-not-allowed disabled:opacity-60"
          disabled>
          Guardar cambios
        </button>
      </div>
    </div>
  </div>
</div>
