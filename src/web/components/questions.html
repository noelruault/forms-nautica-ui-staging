<script async type="module" crossorigin src="/assets/main15.js"></script>
<link rel="stylesheet" crossorigin href="/assets/main.css">
<div class="content-box py-20 px-5">
    <div class="flex justify-between items-center mb-4">
        <a id="backLink" data-link="true" href="/"
            class="inline-flex items-center gap-2 text-sm/6 text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-300">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                <path fill-rule="evenodd"
                    d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z"
                    clip-rule="evenodd" />
            </svg>
            Inicio
        </a>
        <div class="relative flex-1 max-w-md">
            <input type="search" id="questionSearch" placeholder="Buscar preguntas..."
                class="w-full pl-10 pr-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white focus:ring-zinc-500 focus:border-zinc-500 focus:border-transparent">
            <svg class="absolute left-3 top-2.5 h-5 w-5 text-zinc-400 dark:text-zinc-500" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>
        <button id="uploadCsv" type="button"
            class="ml-4 px-4 py-2 bg-zinc-600 hover:bg-zinc-500 text-white rounded-lg transition-colors">
            Subir CSV
        </button>
        <!-- Kept outside the button: a file input nested in a button swallows the click that
             is supposed to open the picker. -->
        <input type="file" id="csvUpload" class="hidden" accept=".csv">
    </div>

    <div class="inline-block min-w-full align-middle">
        <div class="flex flex-wrap items-start justify-between gap-6">
            <div class="space-y-2 max-w-2xl">
                <h1 class="text-2xl font-semibold text-zinc-950 dark:text-white">Visualiza las preguntas existentes</h1>
                <p class="text-sm text-zinc-600 dark:text-zinc-400">
                    Revisa el estado actual de las preguntas y actualízalas cuando sea necesario.
                </p>
            </div>
        </div>
        <table class="min-w-full text-left text-sm/6 text-zinc-950 dark:text-white">
            <thead class="text-zinc-500 dark:text-zinc-400">
                <tr>
                    <th class="border-b border-b-zinc-950/10 px-4 py-2 font-medium dark:border-b-white/10">ID</th>
                    <th class="border-b border-b-zinc-950/10 px-4 py-2 font-medium dark:border-b-white/10">Pregunta</th>
                    <th class="border-b border-b-zinc-950/10 px-4 py-2 font-medium dark:border-b-white/10">Respuestas
                    </th>
                    <!-- <th class="border-b border-b-zinc-950/10 px-4 py-2 font-medium dark:border-b-white/10">
                        <button id="sortByTema" class="flex items-center space-x-1">
                            <span>Tema</span>
                            <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                            </svg>
                        </button>
                    </th> -->
                </tr>
            </thead>
            <tbody id="questionsBody" class="divide-y divide-zinc-950/5 dark:divide-white/5">
                <!-- HTMX will populate this -->
            </tbody>
        </table>

        <div class="mt-4 flex justify-between items-center">
            <button id="loadMoreQuestions" class="px-4 py-2 bg-zinc-600 hover:bg-zinc-500 text-white rounded-lg">
                Cargar más
            </button>
            <span class="text-zinc-500 dark:text-zinc-400 text-sm" id="countDisplay"></span>
        </div>
    </div>
</div>
